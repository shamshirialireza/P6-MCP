name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build twine uv
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
      - name: Build and push Docker image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/shamshirialireza/p6-mcp:${{ github.ref_name }} .
          docker tag ghcr.io/shamshirialireza/p6-mcp:${{ github.ref_name }} ghcr.io/shamshirialireza/p6-mcp:latest
          docker push ghcr.io/shamshirialireza/p6-mcp:${{ github.ref_name }}
          docker push ghcr.io/shamshirialireza/p6-mcp:latest
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
