name: p6-mcp
description: MCP server for Oracle Primavera P6 XER files and live P6 EPPM
homepage: https://github.com/alirezashamshiri/P6-MCP
license: MIT
categories:
  - project-management
  - scheduling
config:
  - name: workspace_dirs
    description: Colon-separated list of directories containing XER files
    required: false
  - name: enable_mutation
    description: Enable write-back tools (default false)
    required: false
    default: "false"
startCommand:
  type: stdio
  command: uvx
  args: ["p6-mcp", "serve", "--transport", "stdio"]
